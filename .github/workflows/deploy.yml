name: WADE Engine CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-size: '16'
          cache: 'npm'

      - name: Install Linting Tooling
        run: npm ci

      - name: Verify Prettier & ESLint Cleanliness
        run: |
          npm run format
          npm run lint

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Backend Python
        run: python -m py_compile backend/**/*.py

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Production Docker Build Compilation
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: wade-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
